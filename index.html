<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>オペ共有</title>
<style>
:root {
  --bg: #ffffff;
  --field: #f5f6f8;
  color-scheme: light;
  --card: #ffffff;
  --text: #1d2330;
  --muted: #667085;
  --line: #e3e6ec;
  --accent: #1f6feb;
  --accent-soft: #e8f0fe;
  --ok: #1a7f4b;
  --ok-soft: #e3f4ea;
  --warn: #b54708;
  --warn-soft: #fef0e1;
  --danger: #c0262d;
  --danger-soft: #fde8e8;
  --radius: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  font-size: 16px; line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--card); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px; min-height: 52px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header h1 { font-size: 17px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .me { font-size: 13px; color: var(--muted); }
main { max-width: 720px; margin: 0 auto; padding-block: 12px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.modal-bg { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 24px; }
.modal { background: var(--card); color: var(--text); border-radius: var(--radius); padding: 18px; width: 100%; max-width: 360px; }
.modal p { margin: 0 0 14px; font-weight: 600; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
nav.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
  background: var(--card); border-top: 1px solid var(--line);
  display: flex; padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs button {
  flex: 1; border: 0; background: none; color: var(--muted);
  padding: 10px 0 12px; font-size: 12px; font-weight: 600;
}
nav.tabs button .ico { display: block; font-size: 20px; line-height: 1.2; }
nav.tabs button.on { color: var(--accent); }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; margin-bottom: 12px;
}
.card h2 { font-size: 15px; margin: 0 0 8px; }
.card h3 { font-size: 14px; margin: 12px 0 6px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); font-size: 13px; }
.small { font-size: 13px; }
.list-item { display: block; width: 100%; text-align: left; cursor: pointer; color: inherit; font: inherit; }
.list-item .title { font-weight: 700; }
.badge {
  display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); white-space: nowrap;
}
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.gray { background: var(--line); color: var(--muted); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: var(--card); color: var(--text);
  border-radius: 10px; padding: 10px 14px; font-size: 15px; font-weight: 600; cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.block { width: 100%; }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn.link { border: 0; background: none; color: var(--accent); padding: 6px 4px; }
label.f { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 12px 0 4px; }
input[type=text], input[type=date], input[type=time], input[type=password], select, textarea {
  width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--field);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
textarea { min-height: 84px; resize: vertical; }
.hint { font-size: 12px; color: var(--warn); margin-top: 4px; }
.check {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line);
}
.check:last-child { border-bottom: 0; }
.check input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--ok); }
.check .who { font-size: 12px; color: var(--muted); }
.check.done .txt { color: var(--muted); text-decoration: line-through; }
details.risk { border: 1px solid var(--line); border-radius: 10px; margin: 6px 0; background: var(--field); }
details.risk summary { padding: 10px 12px; font-weight: 700; cursor: pointer; }
details.risk div { padding: 0 12px 12px; }
ul.plain { margin: 4px 0; padding-left: 20px; }
ul.plain li { margin: 3px 0; }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
.notice.info { background: var(--accent-soft); color: var(--accent); }
.fb { border-top: 1px solid var(--line); padding: 10px 0; }
.fb:first-child { border-top: 0; }
.fb .k { font-size: 12px; font-weight: 700; color: var(--muted); }
.fb .improve { background: var(--ok-soft); border-radius: 8px; padding: 6px 10px; margin-top: 6px; }
.fb .hiyari { background: var(--warn-soft); border-radius: 8px; padding: 6px 10px; margin-top: 6px; }
.pre { white-space: pre-wrap; word-break: break-word; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg label { flex: 1; min-width: 90px; }
.seg input { display: none; }
.seg span {
  display: block; text-align: center; padding: 9px 6px; border: 1px solid var(--line); border-radius: 10px;
  font-size: 14px; font-weight: 600; cursor: pointer; background: var(--field);
}
.seg input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
.center { text-align: center; }
.gate { max-width: 420px; width: calc(100% - 32px); margin: 40px auto; }
.gate h1 { font-size: 22px; text-align: center; }
ol.rules { padding-left: 22px; }
ol.rules li { margin: 8px 0; }
.toast {
  position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 20;
  background: var(--text); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px;
  opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: .92; }
.spinner { text-align: center; padding: 40px 0; color: var(--muted); }
.sectionhead { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 8px; }
.sectionhead h2 { font-size: 15px; margin: 0; color: var(--muted); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.tile .tv { font-size: 26px; font-weight: 800; line-height: 1.2; }
.tile .tv small { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.tile .tl { font-size: 12px; color: var(--muted); }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 160px; padding-top: 18px; border-bottom: 1px solid var(--line); }
.bar { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
.bar .bf { width: 70%; max-width: 22px; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 0; }
.bar .bv { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.bar .bl { position: absolute; bottom: -20px; font-size: 11px; color: var(--muted); }
.bars + * { margin-top: 24px; }
.card .bars { margin-bottom: 22px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
table.tbl th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; border-bottom: 1px solid var(--line); padding: 6px 4px; }
table.tbl td { border-bottom: 1px solid var(--line); padding: 8px 4px; }
table.tbl .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sharebar { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 12px 0 6px; }
.sharebar div { height: 100%; background: var(--ok); border-radius: 999px; }
.who { font-size: 16px; font-weight: 800; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.demo { background: var(--warn-soft); color: var(--warn); font-size: 12px; text-align: center; padding: 4px; }
</style>
</head>

<div id="demo"></div>
<div id="app"><div class="spinner">読み込み中…</div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================

function demoApi(pass, op, p) {
  var db = demoLoad();
  if (pass !== 'ope2026') throw new Error('PASSCODE');
  function put(kind, obj) {
    obj.updatedAt = new Date().toISOString();
    var arr = db[kind], i = arr.findIndex(function (x) { return x.id === obj.id; });
    if (i < 0) arr.push(clone(obj)); else arr[i] = clone(obj);
    demoSave(); return clone(obj);
  }
  function get(kind, id) { var x = db[kind].find(function (o) { return o.id === id; }); return x ? clone(x) : null; }
  switch (op) {
    case 'ping': return { ok: true };
    case 'listAll': return clone(db);
    case 'save': return put(p.kind, p.obj);
    case 'remove': db[p.kind] = db[p.kind].filter(function (x) { return x.id !== p.id; }); demoSave(); return { removed: true };
    case 'toggleCheck':
      var c = get('cases', p.caseId); c.checks = c.checks || {};
      if (p.value) c.checks[p.item] = { by: p.name, at: new Date().toISOString() }; else delete c.checks[p.item];
      return put('cases', c);
    case 'confirm':
      var c2 = get('cases', p.caseId); c2.confirmedBy = c2.confirmedBy || [];
      if (c2.confirmedBy.indexOf(p.name) < 0) c2.confirmedBy.push(p.name);
      return put('cases', c2);
    case 'patch':
      var o = get(p.kind, p.id), fl = p.fields || {};
      Object.keys(fl).forEach(function (k) {
        if (fl[k] && typeof fl[k] === 'object' && !Array.isArray(fl[k]) && o[k] && typeof o[k] === 'object') Object.keys(fl[k]).forEach(function (kk) { o[k][kk] = fl[k][kk]; });
        else o[k] = fl[k];
      });

    case 'seed':
      if (db.templates.length) return { skipped: true };
      p.templates.forEach(function (t) { put('templates', t); }); return { seeded: true };
  }
  throw new Error('UNKNOWN_OP');
}

function call(op, payload) {
  var pass = state.pass;
  return new Promise(function (resolve, reject) {
    if (IS_GAS) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
        reject(new Error(String((e && e.message) || e)));
      }).api(pass, op, payload || {});
    } else if (IS_API) {
      fetch('https://script.google.com/macros/s/' + API_ID + '/exec', {
        method: 'POST', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ pass: pass, op: op, payload: payload || {} })
      }).then(function (r) { return r.json(); }).then(function (j) {
        if (j && j.ok) resolve(j.result); else reject(new Error((j && j.error) || 'SERVER'));
      }, function () { reject(new Error('NETWORK')); });
    } else if (!IS_DEMO) {
      reject(new Error('NO_API'));
    } else {
      setTimeout(function () {
        try { resolve(demoApi(pass, op, payload || {})); } catch (e) { reject(e); }
      }, 60);
    }
  });
}

  var h = '<div class="card"><h2>⏱ 時間と人数の記録</h2><div class="muted">「今」を押すと現在時刻が入ります。あとから時刻を直すこともできます</div>' +
    (UNIT_HINT[c.unitFlow] ? '<div class="notice info" style="margin:8px 0 0">' + esc(UNIT_HINT[c.unitFlow]) + '</div>' : '') +
    PHASES.map(function (ph) {
      return '<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><div class="grow small"><b>' + ph[1] + '</b></div>' +
        '<input type="time" data-a="time" data-id="' + c.id + '" data-k="' + ph[0] + '" value="' + esc(t[ph[0]] || '') + '" style="width:136px">' +
        '<button class="btn sm" data-a="now" data-id="' + c.id + '" data-k="' + ph[0] + '">今</button></div>';
    }).join('') +
    '<div class="row" style="padding:10px 0 0"><div class="grow small"><b>入ったスタッフの人数</b>（術者を含む）</div>' +
    '<input type="text" inputmode="numeric" data-a="staffn" data-id="' + c.id + '" value="' + esc(c.staffCount || '') + '" style="width:70px;text-align:center">人</div>';
  if (d.total != null || d.net != null) {
    h += '<table class="tbl" style="margin-top:10px"><tbody>' +
      [['入室 → クリーニング開始', d.wait], ['クリーニング・麻酔（→ 手術開始）', d.pre], ['正味の手術時間', d.net], ['全体（入室 → 手術終了）', d.total]].map(function (r) {
        return '<tr><td>' + r[0] + '</td><td class="num"><b>' + fmtMin(r[1]) + '</b></td></tr>';
      }).join('') + '</tbody></table>' +
      (d.total && d.net != null ? '<div class="muted" style="margin-top:6px">全体のうち正味の手術時間は ' + Math.round(d.net / d.total * 100) + '%</div>' : '');
  }
  return h + '</div>';
}
var FLOW = { plan: '予定どおり', bit: '少し手間取った', big: '大きく遅れた・中断' };

/* --- 振り返り一覧 --- */
function viewFeedback() {
  var fbs = state.data.feedback.slice().sort(function (a, b) { return b.createdAt.localeCompare(a.createdAt); });
  var f = state.fbFilter;
  if (f) fbs = fbs.filter(function (x) { var c = byId('cases', x.caseId); return c && tplIds(c).indexOf(f) >= 0; });
  var pending = state.data.cases.filter(function (c) {
    return c.status === 'done' && !state.data.feedback.some(function (x) { return x.caseId === c.id; });
  });
  var h = '';
  if (pending.length) {
    h += '<div class="notice">振り返りがまだの症例が ' + pending.length + ' 件あります</div>' + pending.slice(0, 5).map(caseRow).join('');
  }
  h += '<label class="f">処置で絞り込む</label><select data-a="fbfilter"><option value="">すべて</option>' + tplOptions(f) + '</select><div style="height:12px"></div>';
  var imp = fbs.filter(function (x) { return x.improve; });
  if (f && imp.length) {
    h += '<div class="card"><h2>この処置の改善案まとめ（' + imp.length + '）</h2><ul class="plain">' + imp.map(function (x) { return '<li class="pre">' + esc(x.improve) + '</li>'; }).join('') + '</ul>' +
      '<button class="btn sm" data-a="go" data-r="tplForm" data-id="' + f + '">テンプレートに反映する</button></div>';
  }
  h += '<div class="card">' + (fbs.length ? fbs.slice(0, 50).map(function (x) { return fbView(x, true); }).join('') : '<p class="muted">まだ振り返りはありません</p>') + '</div>';
  return h;
}

/* --- テンプレート --- */
function viewTpls() {
  var h = '<button class="btn primary block" data-a="go" data-r="tplForm">＋ 新しいテンプレート</button>';
  CATEGORIES.forEach(function (cat) {
    var ts = state.data.templates.filter(function (t) { return t.category === cat; });
    if (!ts.length) return;
    h += '<div class="sectionhead"><h2>' + esc(cat) + '</h2></div>' + ts.map(function (t) {
      var n = state.data.cases.filter(function (c) { return tplIds(c).indexOf(t.id) >= 0; }).length;
      return '<button class="card list-item" data-a="go" data-r="tpl" data-id="' + t.id + '"><div class="row"><div class="grow title">' + esc(t.name) + '</div>' +
        (t.draft ? '<span class="badge warn">叩き台</span>' : '') + '<span class="badge gray">' + n + '症例</span></div>' +
        '<div class="muted">器具 ' + (t.instruments || []).length + '点・トラブル対応 ' + (t.risks || []).length + '件</div></button>';
    }).join('');
  });
  return h;
}
function viewTpl(id) {

  var imp = state.data.feedback.filter(function (f) { return caseIds.indexOf(f.caseId) >= 0 && (f.improve || f.tools); })
    .sort(function (a, b) { return b.createdAt.localeCompare(a.createdAt); });
  var h = '';
  if (t.draft) h += '<div class="notice">一般的な内容の叩き台です。院長が確認して、医院のやり方に合わせて編集してください。</div>';
  h += '<div class="card"><div class="muted">' + esc(t.category) + '</div><div class="title" style="font-size:18px;font-weight:800">' + esc(t.name) + '</div>' +
    '<div class="row" style="margin-top:8px"><button class="btn sm" data-a="go" data-r="tplForm" data-id="' + t.id + '">編集</button></div>' +
    (t.updatedBy ? '<div class="muted" style="margin-top:6px">最終更新：' + esc(t.updatedBy) + '　' + fmtTs(t.updatedAt) + '</div>' : '') + '</div>';
  if (t.steps) h += '<div class="card"><h2>流れ・手順メモ</h2><div class="pre">' + esc(t.steps) + '</div></div>';
  h += '<div class="card"><h2>🧰 器具・材料</h2><ul class="plain">' + (t.instruments || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
  if ((t.cautions || []).length) h += '<div class="card"><h2>⚠️ 注意点</h2><ul class="plain">' + t.cautions.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
  var risks = pairs(t.risks);
  if (risks.length) h += '<div class="card"><h2>🚨 不測の事態への対応</h2>' + risks.map(function (r) { return '<details class="risk"><summary>' + esc(r[0]) + '</summary><div>' + esc(r[1]) + '</div></details>'; }).join('') + '</div>';
  if ((t.refs || []).length) h += refsCard(t.refs);
  if (imp.length) {
    h += '<div class="card"><h2>📝 振り返りからの声（' + imp.length + '）</h2>' + imp.slice(0, 10).map(function (f) {
      return '<div class="fb">' + (f.tools ? '<div class="k">器具の過不足</div><div class="pre">' + esc(f.tools) + '</div>' : '') +
        (f.improve ? '<div class="improve"><div class="k">改善案</div><div class="pre">' + esc(f.improve) + '</div></div>' : '') +
        '<div class="muted">' + esc(f.author) + '　' + fmtTs(f.createdAt) + '</div></div>';
    }).join('') + '</div>';
  }
  h += '<button class="btn danger block sm" data-a="deltpl" data-id="' + t.id + '">このテンプレートを削除</button>';
  return h;
}
function viewTplForm(id) {

/* --- 統計 --- */
function implantN(c) { return c.system ? (+c.implantCount || lines(c.implantSizes).length || 0) : 0; }
function tally(rows, keyFn, valFn) {
  var m = {};
  rows.forEach(function (r) { var k = keyFn(r); if (!k) return; m[k] = (m[k] || 0) + valFn(r); });
  return Object.keys(m).map(function (k) { return [k, m[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
}
function tableHtml(head, rows) {
  if (!rows.length) return '<p class="muted">データがありません</p>';
  return '<table class="tbl"><thead><tr>' + head.map(function (h, i) { return '<th' + (i ? ' class="num"' : '') + '>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' +
    rows.map(function (r) { return '<tr>' + r.map(function (x, i) { return '<td' + (i ? ' class="num"' : '') + '>' + esc(x) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
}
function viewStats() {
  var done = state.data.cases.filter(function (c) { return c.status === 'done' && c.date; });
  var years = {}; years[new Date().getFullYear()] = 1;
  done.forEach(function (c) { years[c.date.slice(0, 4)] = 1; });
  var y = String(state.statYear);
  var yc = done.filter(function (c) { return c.date.slice(0, 4) === y; });
  var imp = yc.filter(function (c) { return implantN(c) > 0; });
  var total = imp.reduce(function (s, c) { return s + implantN(c); }, 0);
  var now = new Date(), isThisYear = +y === now.getFullYear();
  var months = isThisYear ? now.getMonth() + 1 : 12;
  var monthly = []; for (var m = 1; m <= 12; m++) monthly.push(0);
  imp.forEach(function (c) { monthly[+c.date.slice(5, 7) - 1] += implantN(c); });
  var max = Math.max.apply(null, monthly.concat([1]));
  var upcoming = state.data.cases.filter(function (c) { return c.status !== 'done'; }).reduce(function (s, c) { return s + implantN(c); }, 0);

  // 直近3か月（今日基準）の月平均
  var from = new Date(now.getFullYear(), now.getMonth() - 3, now.getDate()).toISOString().slice(0, 10);
  var recent = done.filter(function (c) { return c.date >= from && implantN(c) > 0; });
  var recentBy = {}; recent.forEach(function (c) { recentBy[c.system] = (recentBy[c.system] || 0) + implantN(c); });

  var h = '<div class="row" style="margin-bottom:12px"><label class="f grow" style="margin:0">年</label><select data-a="statyear" style="width:140px">' +
    Object.keys(years).sort().reverse().map(function (k) { return '<option' + (k === y ? ' selected' : '') + '>' + k + '</option>'; }).join('') + '</select></div>';
  h += '<div class="tiles">' +
    '<div class="tile"><div class="tv">' + total + '<small>本</small></div><div class="tl">' + y + '年の埋入本数</div></div>' +
    '<div class="tile"><div class="tv">' + (Math.round(total / months * 10) / 10) + '<small>本</small></div><div class="tl">月平均' + (isThisYear ? '（今月まで）' : '') + '</div></div>' +
    '<div class="tile"><div class="tv">' + yc.length + '<small>件</small></div><div class="tl">外科処置の件数</div></div>' +
    '<div class="tile"><div class="tv">' + upcoming + '<small>本</small></div><div class="tl">予定中の埋入本数</div></div></div>';

  h += '<div class="card"><h2>月別の埋入本数（' + y + '年）</h2><div class="bars">' + monthly.map(function (v, i) {
    return '<div class="bar" title="' + (i + 1) + '月：' + v + '本"><div class="bv">' + (v || '') + '</div><div class="bf" style="height:' + (v / max * 100) + '%"></div><div class="bl">' + (i + 1) + '</div></div>';
  }).join('') + '</div></div>';

  var bySys = tally(imp, function (c) { return c.system; }, implantN);
  h += '<div class="card"><h2>システム別</h2>' + tableHtml(['システム', '本数', '割合', '直近3か月 月平均'], bySys.map(function (r) {
    return [r[0], r[1] + '本', Math.round(r[1] / total * 100) + '%', (Math.round((recentBy[r[0]] || 0) / 3 * 10) / 10) + '本'];
  })) + '</div>';

  var sizeRows = [];
  imp.forEach(function (c) {
    var ls = lines(c.implantSizes);
    if (ls.length) ls.forEach(function (sz) { sizeRows.push({ k: c.system + '｜' + sz.replace(/[xX＊*]/g, '×').replace(/\s/g, ''), n: 1 }); });
    else sizeRows.push({ k: c.system + '｜サイズ未入力', n: implantN(c) });
  });
  h += '<div class="card"><h2>サイズ別（多い順）</h2>' + tableHtml(['システム｜サイズ', '本数'], tally(sizeRows, function (r) { return r.k; }, function (r) { return r.n; }).map(function (r) { return [r[0], r[1] + '本']; })) + '</div>';

  var bone = yc.filter(function (c) { return (c.grafts || []).indexOf('骨補填材') >= 0; });
  var boneRows = {};
  bone.forEach(function (c) {
    var bs = (c.bones || []).length ? c.bones : [{ type: '種類未入力', amount: '', unit: 'g' }];
    bs.forEach(function (b) {
      var k = (b.type || '種類未入力') + '｜' + (b.unit || 'g');
      var r = boneRows[k] || (boneRows[k] = { n: 0, amt: 0 });
      r.n++; r.amt += parseFloat(b.amount) || 0;
    });
  });
  h += '<div class="card"><h2>骨補填材</h2>' + tableHtml(['種類', '症例数', '使用量の合計'], Object.keys(boneRows).sort(function (a, b) { return boneRows[b].n - boneRows[a].n; }).map(function (k) {
    var p = k.split('｜'); return [p[0], boneRows[k].n + '件', (Math.round(boneRows[k].amt * 100) / 100) + p[1]];
  })) + '</div>';
  var memStat = {};
  yc.filter(function (c) { return (c.grafts || []).indexOf('メンブレン') >= 0; }).forEach(function (c) {
    var ms = (c.membranes || []).length ? c.membranes : [{ type: '種類未入力', count: '' }];
    ms.forEach(function (m) {
      var r = memStat[m.type] || (memStat[m.type] = { n: 0, cnt: 0, sizes: {} });
      r.n++; r.cnt += parseInt(m.count, 10) || 1;
      if (m.size) r.sizes[m.size] = (r.sizes[m.size] || 0) + (parseInt(m.count, 10) || 1);
    });
  });
  var abStat = {};
  yc.filter(function (c) { return (c.grafts || []).indexOf('自家骨') >= 0; }).forEach(function (c) {
    var ab = c.autobone || {}, k = (ab.site || '部位未入力') + '｜' + (ab.unit || 'g');
    var r = abStat[k] || (abStat[k] = { n: 0, amt: 0 }); r.n++; r.amt += parseFloat(ab.amount) || 0;
  });
  if (Object.keys(abStat).length) h += '<div class="card"><h2>自家骨（採取部位別）</h2>' + tableHtml(['採取部位', '症例数', '量の合計'], Object.keys(abStat).sort(function (a, b) { return abStat[b].n - abStat[a].n; }).map(function (k) {
    var p = k.split('｜'); return [p[0], abStat[k].n + '件', (Math.round(abStat[k].amt * 100) / 100) + p[1]];
  })) + '</div>';
  h += '<div class="card"><h2>メンブレン</h2>' + tableHtml(['種類（よく使うサイズ）', '症例数', '枚数'], Object.keys(memStat).sort(function (a, b) { return memStat[b].n - memStat[a].n; }).map(function (k) {
    var sz = Object.keys(memStat[k].sizes).sort(function (a, b) { return memStat[k].sizes[b] - memStat[k].sizes[a]; }).slice(0, 2);
    return [k + (sz.length ? '（' + sz.join('、') + '）' : ''), memStat[k].n + '件', memStat[k].cnt + '枚'];
  })) + '<div class="muted" style="margin-top:6px">枚数が未入力のときは1枚として数えています</div></div>';

  // 時間
  var timed = yc.map(function (c) { return { c: c, d: durations(c) }; });
  function avg(key, rows) { var xs = rows.map(function (r) { return r.d[key]; }).filter(function (x) { return x != null; }); return xs.length ? xs.reduce(function (a, b) { return a + b; }, 0) / xs.length : null; }
  var full = timed.filter(function (r) { return r.d.total != null && r.d.net != null; });
  var ratio = full.length ? full.reduce(function (s, r) { return s + r.d.net; }, 0) / full.reduce(function (s, r) { return s + r.d.total; }, 0) : null;
  h += '<div class="card"><h2>時間（平均）</h2>' +
    (timed.some(function (r) { return r.d.net != null || r.d.total != null; }) ?
      tableHtml(['区間', '平均'], [['入室 → クリーニング開始', fmtMin(avg('wait', timed))], ['クリーニング・麻酔（→ 手術開始）', fmtMin(avg('pre', timed))],
        ['正味の手術時間', fmtMin(avg('net', timed))], ['全体（入室 → 手術終了）', fmtMin(avg('total', timed))]]) +
      (ratio != null ? '<div class="sharebar"><div style="width:' + Math.round(ratio * 100) + '%"></div></div><div class="small">全体のうち<b>正味の手術時間は ' + Math.round(ratio * 100) + '%</b>（全区間を記録した ' + full.length + ' 件）</div>' : '')
      : '<p class="muted">症例画面の「時間と人数の記録」を入れると集計されます</p>') + '</div>';
  var procNames = {}; yc.forEach(function (c) { procNames[c.procedureName || procName(tplsOf(c))] = 1; });
  var procTime = Object.keys(procNames).map(function (pn) {
    var rows = timed.filter(function (r) { return (r.c.procedureName || procName(tplsOf(r.c))) === pn; });
    return [pn, rows.length + '件', fmtMin(avg('net', rows)), fmtMin(avg('total', rows))];
  }).filter(function (r) { return r[2] !== '—' || r[3] !== '—'; });
  if (procTime.length) h += '<div class="card"><h2>処置の組み合わせ別の平均時間</h2>' + tableHtml(['処置', '件数', '正味', '全体'], procTime) + '</div>';
  var groups = [
    ['ユニット3→2', function (c) { return c.sedation !== 'iv' && c.unitFlow === 'u32'; }],
    ['ユニット2のみ', function (c) { return c.sedation !== 'iv' && c.unitFlow === 'u2'; }],
    ['静脈内鎮静', function (c) { return c.sedation === 'iv'; }],
    ['未設定・その他', function (c) { return c.sedation !== 'iv' && c.unitFlow !== 'u32' && c.unitFlow !== 'u2'; }]
  ].map(function (g) {
    var rows = timed.filter(function (r) { return g[1](r.c); });
    return [g[0], rows.length + '件', fmtMin(avg('pre', rows)), fmtMin(avg('net', rows)), fmtMin(avg('total', rows))];
  }).filter(function (r) { return r[1] !== '0件'; });
  if (groups.length) h += '<div class="card"><h2>鎮静・ユニットの使い方別</h2><div style="overflow-x:auto">' +
    tableHtml(['区分', '件数', '前処置', '正味', '全体'], groups) + '</div><div class="muted" style="margin-top:6px">前処置＝クリーニング・麻酔（→ 手術開始）。静脈内鎮静はユニットに関係なくまとめています</div></div>';
  // 人手
  var caseIds = yc.map(function (c) { return c.id; });
  var sfb = state.data.feedback.filter(function (f) { return caseIds.indexOf(f.caseId) >= 0 && f.staff; });
  var shortCases = {}; sfb.forEach(function (f) { if (f.staff === 'short') shortCases[f.caseId] = 1; });
  var withN = yc.filter(function (c) { return +c.staffCount > 0; });
  h += '<div class="card"><h2>人手</h2>' + tableHtml(['項目', ''], [
    ['平均スタッフ人数', withN.length ? (Math.round(withN.reduce(function (s, c) { return s + +c.staffCount; }, 0) / withN.length * 10) / 10) + '人' : '—'],
    ['「足りなかった」の声があった症例', Object.keys(shortCases).length + '件 / ' + yc.length + '件'],
    ['振り返りでの回答（足りた／ぎりぎり／足りなかった）', ['ok', 'tight', 'short'].map(function (k) { return sfb.filter(function (f) { return f.staff === k; }).length; }).join('／')]
  ]) + '</div>';

  var procRows = flat(yc.map(function (c) { return tplIds(c).map(function (id) { var t = byId('templates', id); return t ? t.category + '｜' + t.name : '（削除されたテンプレート）'; }); }));
  var byProc = tally(procRows, function (x) { return x; }, function () { return 1; });
  h += '<div class="card"><h2>処置別の件数（併用はそれぞれに数える）</h2>' + tableHtml(['処置', '件数'], byProc.map(function (r) { return [r[0], r[1] + '件']; })) + '</div>';
  h += '<p class="muted">「オペ終了」にした症例だけを集計しています。骨補填材の量は予定量です。実際と違ったときは症例を編集してください。</p>';
  return h;
}

/* --- 掲示板 --- */
function viewBoard() {
  var ps = state.data.posts.slice().sort(function (a, b) { return b.createdAt.localeCompare(a.createdAt); });
  return '<button class="btn primary block" data-a="go" data-r="postForm">＋ 投稿する</button><div style="height:12px"></div>' +
    (ps.length ? ps.map(function (p) {
      var n = state.data.comments.filter(function (c) { return c.postId === p.id; }).length;
      return '<button class="card list-item" data-a="go" data-r="post" data-id="' + p.id + '"><div class="row"><b class="grow">' + esc(p.author) + '</b><span class="muted">' + fmtTs(p.createdAt) + '</span></div>' +
        '<div class="pre" style="max-height:4.8em;overflow:hidden">' + esc(p.body) + '</div>' +
        '<div class="muted" style="margin-top:4px">💬 ' + n + '</div></button>';
    }).join('') : '<p class="muted">まだ投稿はありません</p>');
}
function viewPostForm() {
  return '<form class="card" data-f="post"><textarea name="body" rows="6" required placeholder="お知らせ・質問・気づきなど"></textarea>' +
    '<div class="hint">患者さんの個人情報は書かないでください。急ぎの連絡は直接か電話で。</div>' +
    '<div style="height:12px"></div><button class="btn primary block">投稿</button></form>';
}
function viewPost(id) {
  var p = byId('posts', id);
  if (!p) return '<p class="muted">削除されました</p>';
  var cs = state.data.comments.filter(function (c) { return c.postId === id; }).sort(function (a, b) { return a.createdAt.localeCompare(b.createdAt); });
  return '<div class="card"><div class="row"><b class="grow">' + esc(p.author) + '</b><span class="muted">' + fmtTs(p.createdAt) + '</span></div>' +
    '<div class="pre" style="margin-top:6px">' + esc(p.body) + '</div>' +
    (p.author === state.name ? '<div class="row" style="justify-content:flex-end"><button class="btn link small" data-a="delpost" data-id="' + p.id + '">削除</button></div>' : '') + '</div>' +
    '<div class="card"><h2>コメント（' + cs.length + '）</h2>' + cs.map(function (c) {
      return '<div class="fb"><div class="row"><b class="grow">' + esc(c.author) + '</b><span class="muted">' + fmtTs(c.createdAt) + '</span></div><div class="pre">' + esc(c.body) + '</div>' +
        (c.author === state.name ? '<div class="row" style="justify-content:flex-end"><button class="btn link small" data-a="delcomment" data-id="' + c.id + '">削除</button></div>' : '') + '</div>';
    }).join('') +
    '<form data-f="comment" data-id="' + id + '" style="margin-top:8px"><textarea name="body" rows="2" required placeholder="コメントを書く"></textarea>' +
    '<div style="height:8px"></div><button class="btn primary block">送信</button></form></div>';
}

/* ---------- 操作 ---------- */
function go(name, id) { state.route = name ? { name: name, id: id || '' } : null; state.history.push(state.route); render(); window.scrollTo(0, 0); }
state.history = [null];
function back() {
  state.history.pop();
  state.route = state.history.length ? state.history[state.history.length - 1] : null;
  render(); window.scrollTo(0, 0);
}
function replaceRoute(name, id) {
  state.history.pop();
  var top = state.history[state.history.length - 1];
  state.route = name ? { name: name, id: id || '' } : null;
  if (!(top && state.route && top.name === state.route.name && top.id === state.route.id)) state.history.push(state.route);
  render(); window.scrollTo(0, 0);
}

var ASK = {
  logout: function () { return 'この端末からログアウトしますか？（データは消えません）'; },
  delcase: function () { return 'この症例と振り返りを削除しますか？'; },
  delfb: function () { return 'この振り返りを削除しますか？'; },
  deltpl: function (id) { return state.data.cases.some(function (c) { return tplIds(c).indexOf(id) >= 0; }) ? 'このテンプレートを使った症例があります。それでも削除しますか？' : 'このテンプレートを削除しますか？'; },
  delpost: function () { return 'この投稿を削除しますか？'; },
  delcomment: function () { return 'このコメントを削除しますか？'; }
};
function askModal(msg) {
  return new Promise(function (resolve) {
    var bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><p>' + esc(msg) + '</p><div class="row"><button class="btn grow" data-m="no">やめる</button><button class="btn danger grow" data-m="yes">削除する</button></div></div>';
    if (/ログアウト/.test(msg)) bg.querySelector('[data-m=yes]').textContent = 'ログアウト';
    bg.addEventListener('click', function (e) {
      var m = e.target.getAttribute('data-m');
      if (m || e.target === bg) { e.stopPropagation(); bg.remove(); resolve(m === 'yes'); }
    });
    document.body.appendChild(bg);
  });
}
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]');
  if (!el || el.tagName === 'SELECT') return;
  var a = el.getAttribute('data-a'), id = el.getAttribute('data-id');
  if (a === 'check') return; // change イベントで処理
  if (ASK[a] && !el._ok) {
    askModal(ASK[a](id)).then(function (ok) { if (ok) { el._ok = true; el.click(); el._ok = false; } });
    return;
  }
  if (a === 'tab') { state.tab = el.getAttribute('data-tab'); state.route = null; state.history = [null]; render(); window.scrollTo(0, 0); }
  else if (a === 'go') go(el.getAttribute('data-r'), id);
  else if (a === 'back') back();
  else if (a === 'reload') { toast('更新中…'); loadAll(); }
  else if (a === 'agree') { LS.set(K_AGREE, '1'); state.agreed = true; render(); loadAll(); }
  else if (a === 'logout') {
    [K_PASS, K_NAME, K_AGREE].forEach(LS.del); location.reload();
  }
  else if (a === 'confirm') {
    run('confirm', { caseId: id, name: state.name }).then(function (c) { upsert('cases', c); render(); toast('確認しました'); });
  }
  else if (a === 'now') {
    var d = new Date(), hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    var tf = {}; tf[el.getAttribute('data-k')] = hm;
    run('patch', { kind: 'cases', id: id, fields: { times: tf } }).then(function (c2) { upsert('cases', c2); render(); toast(hm + ' を記録しました'); });
  }
  else if (a === 'finish') {
    run('patch', { kind: 'cases', id: id, fields: { status: 'done' } }).then(function (c2) { upsert('cases', c2); render(); });
  }
  else if (a === 'delcase') {
    var fbs = state.data.feedback.filter(function (f) { return f.caseId === id; });
    Promise.all(fbs.map(function (f) { return run('remove', { kind: 'feedback', id: f.id }); }))
      .then(function () { return run('remove', { kind: 'cases', id: id }); })
      .then(function () { fbs.forEach(function (f) { drop('feedback', f.id); }); drop('cases', id); back(); toast('削除しました'); });
  }
  else if (a === 'delfb') {
    run('remove', { kind: 'feedback', id: id }).then(function () { drop('feedback', id); render(); });
  }
  else if (a === 'deltpl') {
    var used = state.data.cases.some(function (c) { return tplIds(c).indexOf(id) >= 0; });
    run('remove', { kind: 'templates', id: id }).then(function () { drop('templates', id); back(); });
  }
  else if (a === 'delpost') {
    var cs = state.data.comments.filter(function (c) { return c.postId === id; });
    Promise.all(cs.map(function (c) { return run('remove', { kind: 'comments', id: c.id }); }))
      .then(function () { return run('remove', { kind: 'posts', id: id }); })
      .then(function () { cs.forEach(function (c) { drop('comments', c.id); }); drop('posts', id); back(); });
  }
  else if (a === 'delcomment') {
    run('remove', { kind: 'comments', id: id }).then(function () { drop('comments', id); render(); });
  }
});

document.addEventListener('change', function (e) {
  var el = e.target;
  var a = el.getAttribute('data-a');
  if (a === 'check') {
    var c = byId('cases', el.getAttribute('data-id')), item = c.items[+el.getAttribute('data-i')];
    el.disabled = true;
    run('toggleCheck', { caseId: c.id, item: item, value: el.checked, name: state.name })
      .then(function (c2) { upsert('cases', c2); render(); })
      .catch(function () { render(); });
  } else if (el.name === 'tpl') {
    var fm = el.form, ids = [].slice.call(fm.querySelectorAll('input[name=tpl]:checked')).map(function (x) { return x.value; });
    var tsx = ids.map(function (i) { return byId('templates', i); }).filter(Boolean), box2 = document.getElementById('implantBox');
    if (box2) box2.style.display = hasImplantCat(tsx) ? '' : 'none';
    if (fm.elements.unitFlow && !fm.elements.unitFlow.value && ids.indexOf('t-imm') >= 0) fm.elements.unitFlow.value = 'u32';
  } else if (el.name === 'graft' && el.value === '自家骨') {
    var ax = document.getElementById('autoBox'); if (ax) ax.style.display = el.checked ? '' : 'none';
  } else if (el.name === 'abSite') {
    var ao = el.form.elements.abOther; if (ao) ao.style.display = el.value === '__other' ? '' : 'none';
  } else if (el.name === 'graft' && el.value === 'メンブレン') {
    var mb = document.getElementById('memBox'); if (mb) mb.style.display = el.checked ? '' : 'none';
  } else if (el.name === 'graft' && el.value === '骨補填材') {
    var bb = document.getElementById('boneBox'); if (bb) bb.style.display = el.checked ? '' : 'none';
  } else if (el.name === 'sedation') {
    var ab = document.getElementById('anesBox'); if (ab) ab.style.display = el.value === 'iv' ? '' : 'none';
    var uf = el.form && el.form.elements.unitFlow;
    if (uf && el.value === 'iv') uf.value = 'u2';
  } else if (a === 'time') {
    var tf2 = {}; tf2[el.getAttribute('data-k')] = el.value;
    var cc = byId('cases', el.getAttribute('data-id'));
    if (!cc.times) { cc.times = {}; }
    run('patch', { kind: 'cases', id: cc.id, fields: { times: tf2 } }).then(function (c2) { upsert('cases', c2); render(); });
  } else if (a === 'staffn') {
    var n = parseInt(el.value.replace(/[０-９]/g, function (d) { return String.fromCharCode(d.charCodeAt(0) - 0xFEE0); }), 10);
    run('patch', { kind: 'cases', id: el.getAttribute('data-id'), fields: { staffCount: n > 0 ? n : '' } }).then(function (c2) { upsert('cases', c2); render(); toast('人数を記録しました'); });
  } else if (a === 'statyear') {
    state.statYear = +el.value; render();
  } else if (a === 'fbfilter') {
    state.fbFilter = el.value; render();
  }
});

document.addEventListener('submit', function (e) {
  var f = e.target, kind = f.getAttribute('data-f');
  if (!kind) return;
  e.preventDefault();
  if (state.busy) return;
  var v = function (n) { var x = f.elements[n]; return x ? String(x.value).trim() : ''; };
  var id = f.getAttribute('data-id');
  var btn = f.querySelector('button:last-of-type');
  function busy(p) {
    state.busy = true; if (btn) btn.disabled = true;
    return p.then(function (r) { state.busy = false; return r; }, function (err) { state.busy = false; if (btn) btn.disabled = false; throw err; });
  }

  if (kind === 'pass') {
    state.pass = v('pass');
    busy(call('ping')).then(function () { LS.set(K_PASS, state.pass); render(); if (state.name && state.agreed) loadAll(); })
      .catch(function (err) {
        var m = String(err && err.message || err);
        state.pass = ''; render();
        toast(m.indexOf('LOCKED') >= 0 ? '入力ミスが続いたため、10分ほどお待ちください' : m.indexOf('PASSCODE') >= 0 ? '合言葉が違います' : 'つながりませんでした。電波を確認してください');
      });
  }
  else if (kind === 'name' || kind === 'rename') {
    state.name = v('name'); LS.set(K_NAME, state.name);
    if (kind === 'rename') { toast('変更しました'); back(); } else { render(); if (state.agreed) loadAll(); }
  }
  else if (kind === 'case') {
    var chart = v('chartNo');
    if (!/^[0-9A-Za-z\-]+$/.test(chart)) { toast('カルテ番号は半角英数字で入力してください'); return; }
    var c = id ? clone(byId('cases', id)) : { id: uid(), status: 'planned', checks: {}, confirmedBy: [], createdBy: state.name, createdAt: new Date().toISOString() };
    var tids = [].slice.call(f.querySelectorAll('input[name=tpl]:checked')).map(function (x) { return x.value; });
    if (!tids.length) { toast('処置を1つ以上選んでください'); return; }
    c.templateIds = tids; delete c.templateId; c.procedureName = procName(tplsOf(c)); c.items = c.items || [];
    c.date = v('date'); c.time = v('time'); c.chartNo = chart; c.age = v('age'); c.sex = v('sex'); c.site = v('site'); c.detail = v('detail');
    c.roles = { surgeon: v('surgeon'), assist: v('assist'), circ: v('circ') }; c.notes = v('notes');
    c.sedation = (f.querySelector('input[name=sedation]:checked') || {}).value || 'none';
    c.anesthetist = c.sedation === 'iv' ? v('anesthetist') : '';
    c.unitFlow = v('unitFlow');
    if (hasImplantCat(tplsOf(c))) {
      c.system = v('system');
      c.implantSizes = c.system ? v('implantSizes') : '';
      var cnt = parseInt(String(v('implantCount')).replace(/[０-９]/g, function (d) { return String.fromCharCode(d.charCodeAt(0) - 0xFEE0); }), 10);
      c.implantCount = c.system ? (cnt > 0 ? cnt : lines(c.implantSizes).length || '') : '';
      c.guide = (f.querySelector('input[name=guide]:checked') || {}).value || 'none';
      c.grafts = [].slice.call(f.querySelectorAll('input[name=graft]:checked')).map(function (x) { return x.value; });
      c.bones = [];
      if (c.grafts.indexOf('骨補填材') >= 0) {
        [].slice.call(f.querySelectorAll('input[name=bone]:checked')).forEach(function (x) {
          var i = x.value; c.bones.push({ type: BONE_MATERIALS[+i], amount: v('boneAmt' + i), unit: v('boneUnit' + i) });
        });
        if (v('boneOther')) c.bones.push({ type: v('boneOther'), amount: v('boneAmtX'), unit: v('boneUnitX') });
      }
      c.autobone = c.grafts.indexOf('自家骨') >= 0
        ? { site: v('abSite') === '__other' ? v('abOther') : v('abSite'), amount: v('abAmt'), unit: v('abUnit') } : null;
      c.membranes = [];
      if (c.grafts.indexOf('メンブレン') >= 0) {
        [].slice.call(f.querySelectorAll('input[name=mem]:checked')).forEach(function (x) {
          var i = x.value; c.membranes.push({ type: MEMBRANES[+i], size: v('memSize' + i), count: v('memCnt' + i) });
        });
        if (v('memOther')) c.membranes.push({ type: v('memOther'), size: v('memSizeX'), count: v('memCntX') });
      }
    } else {
      c.system = ''; c.implantSizes = ''; c.implantCount = ''; c.guide = 'none'; c.grafts = []; c.bones = []; c.membranes = []; c.autobone = null;
    }
    var oldM = c.managed || c.autoItems || [], newM = managedItems(c);
    c.items = c.items.filter(function (i) { return oldM.indexOf(i) < 0 || newM.indexOf(i) >= 0 || (c.checks || {})[i]; });
    newM.forEach(function (i) { if (c.items.indexOf(i) < 0) c.items.push(i); });
    c.managed = newM; delete c.autoItems;
    busy(run('save', { kind: 'cases', obj: c })).then(function (c2) { upsert('cases', c2); toast('保存しました'); replaceRoute('case', c2.id); });
  }
  else if (kind === 'additem') {
    var c3 = clone(byId('cases', id)), item = v('item');
    if (c3.items.indexOf(item) >= 0) { toast('すでにあります'); return; }
    c3.items.push(item);
    busy(run('save', { kind: 'cases', obj: c3 })).then(function (c4) { upsert('cases', c4); render(); });
  }
  else if (kind === 'fb') {
    var fb = { id: uid(), caseId: id, author: state.name, createdAt: new Date().toISOString(),
      flow: (f.querySelector('input[name=flow]:checked') || {}).value || 'plan',
      staff: (f.querySelector('input[name=staff]:checked') || {}).value || '', slow: v('slow'),
      good: v('good'), tools: v('tools'), hiyari: v('hiyari'), improve: v('improve') };
    if (!fb.good && !fb.tools && !fb.hiyari && !fb.improve && !fb.slow) { toast('どれか1つは書いてください'); return; }
    busy(run('save', { kind: 'feedback', obj: fb })).then(function (x) { upsert('feedback', x); render(); toast('ありがとうございます'); });
  }
  else if (kind === 'tpl') {
    var t2 = id ? clone(byId('templates', id)) : { id: uid() };
    t2.category = v('category'); t2.name = v('name'); t2.instruments = lines(v('instruments'));
    t2.cautions = lines(v('cautions')); t2.risks = lines(v('risks')); t2.steps = v('steps'); t2.refs = lines(v('refs'));
    t2.draft = false; t2.updatedBy = state.name;
    busy(run('save', { kind: 'templates', obj: t2 })).then(function (x) { upsert('templates', x); toast('保存しました'); replaceRoute('tpl', x.id); });
  }
  else if (kind === 'post') {
    var p = { id: uid(), author: state.name, body: v('body'), createdAt: new Date().toISOString() };
    busy(run('save', { kind: 'posts', obj: p })).then(function (x) { upsert('posts', x); replaceRoute('post', x.id); });
  }
  else if (kind === 'comment') {
    var cm = { id: uid(), postId: id, author: state.name, body: v('body'), createdAt: new Date().toISOString() };
    busy(run('save', { kind: 'comments', obj: cm })).then(function (x) { upsert('comments', x); render(); });
  }
});

/* ---------- 起動 ---------- */
render();
if (state.pass && state.name && state.agreed) loadAll();
</script>
